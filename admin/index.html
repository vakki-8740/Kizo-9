<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="FAVICON/zpekLogo.webp" />
  <title>KIXO 9 GAME - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <img src="logo/zpekLogo.webp" alt="Logo" class="logo" />
      <span class="brand">COMPLAIN PAGE<small>Admin Panel</small></span>
      <div class="header-actions">
        <button type="button" class="settings-btn menu-btn" id="menuBtn" title="Menu" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          Menu
        </button>
      </div>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay" hidden>
    <nav class="menu-panel" aria-label="Main menu">
      <div class="menu-head">
        <span>Menu</span>
        <button type="button" class="menu-x" id="menuClose" aria-label="Close menu">&times;</button>
      </div>

      <button type="button" class="menu-item" data-page="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg>
        <span>Home</span>
      </button>

      <button type="button" class="menu-item" data-page="chats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path></svg>
        <span>Chat Page</span>
      </button>

      <button type="button" class="menu-item" data-page="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.33.43.57.79.66H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
        <span>Settings Page</span>
      </button>
    </nav>
  </div>

  <main class="container" id="listView">
    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">Total Complaints</span>
        <span class="stat-num" id="totalCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Today Complaints</span>
        <span class="stat-num" id="todayCount">0</span>
      </div>
    </div>

    <div class="card">
      <div class="list-head">
        <h2>All Complaints</h2>
      </div>

      <div id="errorBox"></div>
      <div id="complaintList"><p class="loading">Loading complaints...</p></div>
    </div>
  </main>

  <main class="container" id="detailView" style="display: none;">
    <div class="card">
      <div id="detailContent"></div>
      <button type="button" class="back-btn" id="backBtn">&#8592; All Complaints</button>
    </div>
  </main>

  <main class="container" id="settingsView" style="display: none;">
    <div class="card">
      <div class="list-head">
        <h2>Settings</h2>
      </div>

      <div id="settingsError"></div>

      <form id="settingsForm" novalidate>
        <p class="field-group">General</p>

        <label class="field" for="setChatUrl">
          <span>Online Chat URL</span>
          <input type="url" id="setChatUrl" placeholder="https://t.me/your_username" autocomplete="off" />
          <small>Home page ke Live Chat card ke Get Help button par click karne par user isi URL par redirect hoga. Khali chhodoge to user ko "Live chat is not available" message dikhega.</small>
        </label>

        <p class="field-group">Complaint Telegram Alerts</p>

        <label class="field" for="setToken">
          <span>Telegram Bot Token</span>
          <input type="text" id="setToken" placeholder="123456789:AAH..." autocomplete="off" />
          <small>@BotFather se mila hua token. Har naye complaint par isi se alert bhejega.</small>
        </label>

        <label class="field" for="setChatId">
          <span>Telegram Chat ID</span>
          <input type="text" id="setChatId" placeholder="-100123456789" autocomplete="off" />
          <small>Group ka chat id (negative number) ya aapka personal user id.</small>
        </label>

        <p class="field-group">Chat Telegram Alerts</p>

        <label class="field" for="setChatToken">
          <span>Chat Bot Token</span>
          <input type="text" id="setChatToken" placeholder="987654321:AAH..." autocomplete="off" />
          <small>Chat ke liye alag bot banao. Har chat message (user + admin) isi se Telegram par jayega.</small>
        </label>

        <label class="field" for="setChatChatId">
          <span>Chat Bot Chat ID</span>
          <input type="text" id="setChatChatId" placeholder="-100123456789" autocomplete="off" />
          <small>Chat alerts wale bot ka group id ya personal id. Khali chhodoge to chat alert band ho jayega.</small>
        </label>

        <button type="submit" class="btn btn-blue" id="saveSettingsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Save Settings
        </button>
      </form>
    </div>

    <button type="button" class="back-btn" id="settingsBackBtn">&#8592; All Complaints</button>
  </main>

  <main class="container" id="chatsView" style="display: none;">
    <div class="card">
      <div class="list-head">
        <h2>Chats</h2>
      </div>

      <div id="chatsError"></div>
      <div id="chatsList"><p class="loading">Loading chats...</p></div>
    </div>

    <button type="button" class="back-btn" id="chatsBackBtn">&#8592; All Complaints</button>
  </main>

  <main class="container" id="chatDetailView" style="display: none;">
    <div class="card">
      <div id="chatDetailContent"></div>

      <div class="detail-actions">
        <button type="button" class="btn btn-blue" id="chatOpenRoomBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path></svg>
          Open Chat
        </button>
      </div>
    </div>

    <button type="button" class="back-btn" id="chatDetailBackBtn">&#8592; Chats</button>
  </main>

  <main class="container" id="chatRoomView" style="display: none;">
    <div class="card">
      <div class="room-head">
        <div class="room-title">
          <b id="roomName">Chat</b>
          <span id="roomMeta"></span>
        </div>
        <button type="button" class="back-btn" id="roomCloseBtn">&#8592; Chats</button>
      </div>

      <div class="room-msgs" id="roomMsgs"><p class="empty">Loading messages...</p></div>

      <form class="room-composer" id="roomForm">
        <button type="button" class="icon-btn" id="roomImgBtn" title="Send image" aria-label="Send image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg>
        </button>
        <button type="button" class="icon-btn" id="roomFileBtn" title="Send file or PDF" aria-label="Send file or PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
        </button>
        <input type="text" id="roomInput" placeholder="Type a reply" autocomplete="off" maxlength="2000" />
        <button type="submit" class="btn btn-blue" id="roomSendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          Send
        </button>
      </form>

      <input type="file" id="roomImgInput" accept="image/*" hidden />
      <input type="file" id="roomFileInput" hidden />
    </div>
  </main>

  <div class="img-overlay" id="imgOverlay">
    <div class="img-modal">
      <button type="button" class="img-close" id="imgClose" aria-label="Close image">&times;</button>
      <img id="imgView" alt="Payment screenshot" />
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="admin.js"></script>

  <script type="module" src="admin-firebase.js"></script>
</body>
</html>
