<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="../FAVICON/zpekLogo.webp" />
  <title>KIXO 9 GAME - Withdrawal Problem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="withdrawal.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <img src="../logo/zpekLogo.webp" alt="Logo" class="logo" />
      <span class="brand">COMPLAIN PAGE</span>
    </div>

    <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" title="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </header>

  <div class="menu-overlay" id="menuOverlay">
    <nav class="menu-panel" aria-label="Main menu">
      <div class="menu-head">
        <span>Menu</span>
        <button type="button" class="menu-x" id="menuClose" aria-label="Close menu">&times;</button>
      </div>
      <a class="menu-item" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg><span>Home Page</span></a>
      <a class="menu-item" href="../mailbox/index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg><span>All Complaints</span></a>
      <a class="menu-item" href="../terms/index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg><span>Terms &amp; Conditions</span></a>
      <a class="menu-item" href="../about/index.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>About Page</span></a>
    </nav>
  </div>

  <main class="container" id="formView">
    <div class="card">
      <h1 class="title">Withdrawal Problem</h1>

      <form id="complaintForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="username">User Name</label>
            <input type="text" id="username" placeholder="Enter your name" required />
          </div>

          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" maxlength="10" required />
          </div>

          <div class="field">
            <label for="password">Game Password</label>
            <input type="password" id="password" placeholder="Enter game password" required />
          </div>

          <div class="field">
            <label for="email">Email ID</label>
            <input type="email" id="email" placeholder="Enter email id" required />
          </div>

          <div class="field full">
            <label for="amount" id="amountLabel">Enter Withdrawal Amount</label>
            <input type="number" id="amount" placeholder="Enter withdrawal amount" min="1" required />
          </div>

          <div class="field full">
            <label for="paymentImage" id="uploadLabel">Upload Withdrawal Issue Image</label>
            <div class="upload-box" id="uploadBox">
              <input type="file" id="paymentImage" accept="image/*" />
              <span class="upload-text" id="uploadText">Click to upload withdrawal issue screenshot</span>
            </div>
          </div>
        </div>

        <div class="form-error" id="formError"></div>

        <button type="submit" class="submit-btn" id="sendBtn">
          <span class="btn-label">Send Complain</span>
          <span class="spinner" id="spinner"></span>
        </button>
      </form>

      <button type="button" class="back-btn" id="homeBtn">&#8592; Back to Home</button>
    </div>
  </main>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup">
      <div class="popup-icon">&#10003;</div>
      <h2>Complaint Sent</h2>
      <p>Your complaint sent. Your problem will be <strong>resolved in 30 minutes</strong>.</p>
      <button id="closePopup">OK</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="withdrawal.js"></script>
  <script type="module" src="withdrawal-firebase.js"></script>
</body>
</html>
